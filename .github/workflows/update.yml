name: update

# Pick up new d8ctl releases (camunda/d8ctl GitHub Releases) and c8ctl
# releases (@camunda8/cli on npm). On a change: install and test the bumped
# formula, then commit it to main. Nothing upstream has to know this tap exists.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
        id: brew
      - name: Check upstream
        id: bump
        working-directory: ${{ steps.brew.outputs.repository-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update.py | tee /tmp/bumps.txt
          echo "changed=$(cut -d' ' -f1 /tmp/bumps.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Audit, install, test
        if: steps.bump.outputs.changed != ''
        run: |
          set -euo pipefail
          for f in ${{ steps.bump.outputs.changed }}; do
            brew style "camunda/tap/$f"
            brew audit --strict --formula "camunda/tap/$f"
            brew install --formula "camunda/tap/$f"
            brew test "camunda/tap/$f"
          done
      - name: Commit
        if: steps.bump.outputs.changed != ''
        working-directory: ${{ steps.brew.outputs.repository-path }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/
          git commit -m "chore: $(paste -sd ',' /tmp/bumps.txt | sed 's/,/, /g')"
          git push origin HEAD:main
